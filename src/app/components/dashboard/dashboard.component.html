<div class="converter-container">
  <h2>Conversor Numérico</h2>
  <form (submit)="convertNumber($event)">
    <div class="form-group">
      <label for="numberInput">Número</label>
      <input
        type="text"
        id="numberInput"
        (input)="onNumberInputChange($event)"
        required
      />
    </div>

    <div class="form-group">
      <label for="inputType">Tipo de entrada</label>
      <select id="inputType" (change)="onInputTypeChange($event)" required>
        <option value="decimal">Decimal</option>
        <option value="binary">Binario</option>
        <option value="hexadecimal">Hexadecimal</option>
        <option value="octal">Octal</option>
      </select>
    </div>

    <div class="form-group">
      <label for="outputType">Convertir a</label>
      <select id="outputType" (change)="onOutputTypeChange($event)" required>
        <option value="decimal">Decimal</option>
        <option value="binary">Binario</option>
        <option value="hexadecimal">Hexadecimal</option>
        <option value="octal">Octal</option>
      </select>
    </div>

    <button type="submit">Convertir</button>
  </form>

  <div [class.hidden]="!showConversionResult">
    <h3>Resultado: {{ conversionResult }}</h3>
  </div>
</div>

<div class="converter-container">
  <h2>ASCII a Binario</h2>
  <form (submit)="convertTextToBinary($event)">
    <div class="form-group">
      <label for="textInput">Ingrese texto (máximo 20 caracteres)</label>
      <input
        type="text"
        id="textInput"
        maxlength="20"
        (input)="onTextInputChange($event)"
        required
      />
    </div>

    <button type="submit">Convertir a Binario</button>
  </form>

  <div [class.hidden]="!showBinaryResult">
    <h3>Resultado:</h3>
    <p>{{ binaryResult }}</p>
  </div>
</div>
